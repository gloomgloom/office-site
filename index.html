<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Офисный центр — Варианты массинга</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0C0C0B;
  --bg2: #141413;
  --bg3: #1C1C1A;
  --line: rgba(255,255,255,0.07);
  --line2: rgba(255,255,255,0.13);
  --text: #F0EDE6;
  --muted: #6B6860;
  --accent: #C8B89A;
  --accent2: #8C7A62;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  overflow: hidden;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* HEADER */
header {
  height: 48px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  border-bottom: 0.5px solid var(--line);
  z-index: 20;
}
.logo-title { font-family: 'DM Serif Display', serif; font-size: 15px; color: var(--text); }
.logo-sub { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-left: 14px; }
.header-right { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }

/* STAGE */
.stage {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
}

/* BG PARALLAX */
.bg-layer { position: absolute; inset: -40px; z-index: 0; pointer-events: none; }
.bg-img { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease; }
.bg-img img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; filter: brightness(0.18) saturate(0.4); }
.bg-img.active { opacity: 1; }
.vignette {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 100%, transparent 40%, var(--bg) 90%),
    linear-gradient(to bottom, var(--bg) 0%, transparent 20%, transparent 70%, var(--bg) 100%),
    linear-gradient(to right, var(--bg) 0%, transparent 15%, transparent 85%, var(--bg) 100%);
  z-index: 1; pointer-events: none;
}

/* EMPTY */
.empty {
  position: absolute; inset: 0; z-index: 5;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  transition: opacity 0.4s, transform 0.4s; pointer-events: none;
}
.empty.hidden { opacity: 0; transform: translateY(-8px); }
.empty-line { width: 0.5px; height: 48px; background: var(--line2); }
.empty-text { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }

/* ── PANELS ── */
.panels {
  position: absolute; inset: 0; z-index: 5;
  display: grid;
  grid-template-columns: 1fr 0.5px 1fr;
  grid-template-rows: 1fr;
  opacity: 0; pointer-events: none;
  transform: translateY(16px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.panels.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }

.divider-v { background: var(--line); }
.divider-h { display: none; background: var(--line); height: 0.5px; }

/* each panel */
.panel { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

.panel-head {
  padding: 14px 24px 10px;
  display: flex; align-items: baseline; justify-content: space-between;
  border-bottom: 0.5px solid var(--line);
  flex-shrink: 0;
}
.panel-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
.panel-num { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--accent); line-height: 1; }

/* image fills full width, height proportional */
.panel-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.panel-img-wrap {
  width: 100%;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  align-items: stretch;
  justify-content: center;
}
.panel-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
  display: block;
  transition: opacity 0.3s, transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94);
}
.panel-img-wrap img.entering { opacity: 0; transform: scale(0.97) translateY(8px); }
.panel-img-wrap img.entered  { opacity: 1; transform: scale(1) translateY(0); }

/* DATA STRIP — only under axo panel */
.panel-data {
  flex-shrink: 0;
  border-top: 0.5px solid var(--line);
  padding: 10px 24px 12px;
  display: none;
}
.panel-data.has-data { display: block; }
.data-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px 12px;
}
.data-item { display: flex; flex-direction: column; gap: 2px; }
.data-label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.data-value { font-size: 12px; color: var(--text); font-weight: 400; }
.data-total {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 0.5px solid var(--line);
  display: flex; align-items: baseline; gap: 10px;
}
.data-total .data-label { font-size: 9px; }
.data-total .data-value { font-size: 14px; color: var(--accent); font-family: 'DM Serif Display', serif; }

/* CLOSE */
.close-btn {
  position: absolute; top: 0; right: 0; height: 48px; z-index: 20; border-left: 0.5px solid var(--line2); border-bottom: 0.5px solid var(--line2);
  background: transparent; border: 0.5px solid var(--line2); color: var(--muted);
  font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  padding: 0 20px; cursor: pointer;
  transition: border-color 0.2s, color 0.2s; display: none;
  -webkit-tap-highlight-color: transparent;
}
.close-btn:hover { border-color: var(--accent2); color: var(--text); }

/* KEY HINTS */
.key-hint {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 24px; z-index: 10; pointer-events: none;
  opacity: 0; transition: opacity 0.4s;
}
.key-hint.visible { opacity: 1; }
.key-tag { display: flex; align-items: center; gap: 7px; font-size: 10px; letter-spacing: 0.14em; color: var(--muted); }
.key { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border: 0.5px solid var(--line2); font-size: 11px; }

/* STRIP */
.strip {
  flex-shrink: 0; height: clamp(200px, 25vh, 320px);
  border-top: 0.5px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--bg); z-index: 10;
}
.thumb {
  position: relative; display: flex; flex-direction: column;
  cursor: pointer; border-right: 0.5px solid var(--line); overflow: hidden;
  -webkit-tap-highlight-color: transparent; user-select: none; transition: background 0.2s;
}
.thumb:last-child { border-right: none; }
.thumb:hover { background: var(--bg2); }
.thumb.active { background: var(--bg3); }
.thumb::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1.5px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  transform: scaleX(0); transition: transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
  z-index: 3; transform-origin: center;
}
.thumb.active::before, .thumb:hover::before { transform: scaleX(1); }
.thumb-img-wrap { flex: 1; overflow: hidden; min-height: 0; background: #111110; }
.thumb-img-wrap img {
  width: 100%; height: 100%; object-fit: contain; object-position: center bottom; display: block;
  filter: grayscale(40%) brightness(0.7); transition: filter 0.3s, transform 0.3s;
}
.thumb:hover .thumb-img-wrap img { filter: grayscale(10%) brightness(0.85); transform: scale(1.04); }
.thumb.active .thumb-img-wrap img { filter: grayscale(0%) brightness(0.9); }
.thumb-foot {
  height: 32px; flex-shrink: 0; padding: 0 12px;
  border-top: 0.5px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
}
.thumb-num { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); transition: color 0.2s; }
.thumb:hover .thumb-num, .thumb.active .thumb-num { color: var(--accent); }

/* ── MOBILE ── */
@media (max-width: 600px) {
  header { padding: 0 16px; height: 44px; }
  .logo-sub { display: none; }

  .panels { grid-template-columns: 1fr; grid-template-rows: auto 0.5px auto; }
  .divider-v { display: none; }
  .divider-h { display: block; }

  .panel-head { padding: 10px 16px 8px; }
  .panel-num { font-size: 16px; }
  .panel-data { padding: 8px 16px 10px; }
  .data-grid { grid-template-columns: repeat(2, 1fr); gap: 4px 10px; }
  .data-value { font-size: 11px; }
  .data-label { font-size: 8px; }
  .data-total .data-value { font-size: 13px; }

  .close-btn { top: 8px; right: 12px; font-size: 9px; padding: 5px 11px; }
  .key-hint { display: none; }
  .strip { height: clamp(110px, 18vh, 160px); }
  .thumb-foot { height: 26px; }
  .thumb-num { font-size: 9px; }
}

/* ── TABLET ── */
@media (min-width: 601px) and (max-width: 900px) {
  .strip { height: clamp(130px, 20vh, 200px); }
  .thumb-foot { height: 28px; }
  .panel-head { padding: 12px 20px 10px; }
  .panel-data { padding: 8px 20px 10px; }
  .key-hint { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <span class="logo-title">Офисный центр</span>
      <span class="logo-sub">Варианты массинга</span>
    </div>
    <div class="header-right">5 вариантов</div>
  </header>

  <div class="stage" id="stage">
    <div class="bg-layer" id="bgLayer">
      <div class="bg-img" id="bg1"><img src="imgs/v1_render.jpg" alt=""></div>
      <div class="bg-img" id="bg2"><img src="imgs/v2_render.jpg" alt=""></div>
      <div class="bg-img" id="bg3"><img src="imgs/v3_render.jpg" alt=""></div>
      <div class="bg-img" id="bg4"><img src="imgs/v4_render.jpg" alt=""></div>
      <div class="bg-img" id="bg5"><img src="imgs/v5_render.jpg" alt=""></div>
    </div>
    <div class="vignette"></div>

    <div class="empty" id="empty">
      <div class="empty-line"></div>
      <span class="empty-text">Выберите вариант</span>
      <div class="empty-line"></div>
    </div>

    <div class="panels" id="panels">
      <!-- AXO PANEL -->
      <div class="panel">
        <div class="panel-head">
          <span class="panel-label">Аксонометрия</span>
          <span class="panel-num" id="numLeft"></span>
        </div>
        <div class="panel-body">
          <div class="panel-img-wrap">
            <img id="imgAxo" src="" alt="Аксонометрия" class="entering">
          </div>
          <div class="panel-data" id="panelData">
            <div class="data-grid" id="dataGrid"></div>
            <div class="data-total">
              <span class="data-label">Общая поэтажная площадь</span>
              <span class="data-value" id="dataTotal"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="divider-v"></div>
      <div class="divider-h"></div>

      <!-- RENDER PANEL -->
      <div class="panel">
        <div class="panel-head">
          <span class="panel-label">Визуализация</span>
          <span class="panel-num" id="numRight"></span>
        </div>
        <div class="panel-body">
          <div class="panel-img-wrap">
            <img id="imgRender" src="" alt="Визуализация" class="entering">
          </div>
        </div>
      </div>
    </div>

    <button class="close-btn" id="closeBtn" onclick="closeView()">Закрыть</button>
    <div class="key-hint" id="keyHint">
      <span class="key-tag"><span class="key">←</span> пред.</span>
      <span class="key-tag">след. <span class="key">→</span></span>
    </div>
  </div>

  <div class="strip">
    <div class="thumb" id="t1" onclick="openVariant(1)">
      <div class="thumb-img-wrap"><img src="imgs/v1_sketch.jpg" alt="01"></div>
      <div class="thumb-foot"><span class="thumb-num">01</span></div>
    </div>
    <div class="thumb" id="t2" onclick="openVariant(2)">
      <div class="thumb-img-wrap"><img src="imgs/v2_sketch.jpg" alt="02"></div>
      <div class="thumb-foot"><span class="thumb-num">02</span></div>
    </div>
    <div class="thumb" id="t3" onclick="openVariant(3)">
      <div class="thumb-img-wrap"><img src="imgs/v3_sketch.jpg" alt="03"></div>
      <div class="thumb-foot"><span class="thumb-num">03</span></div>
    </div>
    <div class="thumb" id="t4" onclick="openVariant(4)">
      <div class="thumb-img-wrap"><img src="imgs/v4_sketch.jpg" alt="04"></div>
      <div class="thumb-foot"><span class="thumb-num">04</span></div>
    </div>
    <div class="thumb" id="t5" onclick="openVariant(5)">
      <div class="thumb-img-wrap"><img src="imgs/v5_sketch.jpg" alt="05"></div>
      <div class="thumb-foot"><span class="thumb-num">05</span></div>
    </div>
  </div>
</div>

<script>
var current = null;
var animT = null;

/* ── ДАННЫЕ из аксонометрии ── */
var DATA = {
  1: {
    floors: [
      { label: 'Корпус 1', val: '21 эт. · 19 400 м²' },
      { label: 'Корпус 2', val: '18 эт. · 12 000 м²' },
      { label: 'Корпус 3', val: '25 эт. · 18 000 м²' },
      { label: 'Стилобат', val: '9 600 м²' },
    ],
    total: '50 000 м²'
  },
  2: {
    floors: [
      { label: 'Корпус 1', val: '32 эт.' },
      { label: 'Корпус 2', val: '28 эт.' },
      { label: 'Стилобат', val: 'общий' },
    ],
    total: '~50 000 м²'
  },
  3: {
    floors: [
      { label: 'Корпус 1', val: '35 эт.' },
      { label: 'Корпус 2', val: '18 эт.' },
      { label: 'Стилобат', val: 'общий' },
    ],
    total: '~50 000 м²'
  },
  4: {
    floors: [
      { label: 'Корпус 1', val: '30 эт.' },
      { label: 'Корпус 2', val: '30 эт.' },
      { label: 'Стилобат', val: 'общий' },
    ],
    total: '~50 000 м²'
  },
  5: {
    floors: [
      { label: 'Корпус 1', val: '21 эт. · 16 000 м²' },
      { label: 'Корпус 2', val: '16 эт. · 13 000 м²' },
      { label: 'Корпус 3', val: '25 эт. · 19 000 м²' },
      { label: 'Стилобат', val: '9 000 м²' },
    ],
    total: '50 000 м²'
  }
};

function openVariant(v) {
  var changing = current !== null && current !== v;
  current = v;

  document.querySelectorAll('.bg-img').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('bg' + v).classList.add('active');

  var num = '0' + v;
  document.getElementById('numLeft').textContent = num;
  document.getElementById('numRight').textContent = num;

  var axo = document.getElementById('imgAxo');
  var rnd = document.getElementById('imgRender');

  if (changing) {
    axo.classList.remove('entered'); axo.classList.add('entering');
    rnd.classList.remove('entered'); rnd.classList.add('entering');
    clearTimeout(animT);
    animT = setTimeout(function() { swapSrc(v); }, 80);
  } else { swapSrc(v); }

  /* fill data */
  var d = DATA[v];
  var grid = document.getElementById('dataGrid');
  grid.innerHTML = '';
  d.floors.forEach(function(f) {
    var item = document.createElement('div');
    item.className = 'data-item';
    item.innerHTML = '<span class="data-label">' + f.label + '</span><span class="data-value">' + f.val + '</span>';
    grid.appendChild(item);
  });
  document.getElementById('dataTotal').textContent = d.total;
  document.getElementById('panelData').classList.add('has-data');

  document.getElementById('panels').classList.add('visible');
  document.getElementById('empty').classList.add('hidden');
  document.getElementById('closeBtn').style.display = 'block';
  document.getElementById('keyHint').classList.add('visible');

  document.querySelectorAll('.thumb').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('t' + v).classList.add('active');
}

function swapSrc(v) {
  var axo = document.getElementById('imgAxo');
  var rnd = document.getElementById('imgRender');
  axo.src = 'imgs/v' + v + '_axo.jpg';
  rnd.src = 'imgs/v' + v + '_render.jpg';
  function enter(img) {
    img.onload = function() { img.classList.remove('entering'); img.classList.add('entered'); };
    if (img.complete && img.naturalWidth) { img.classList.remove('entering'); img.classList.add('entered'); }
  }
  enter(axo); enter(rnd);
}

function closeView() {
  current = null;
  document.getElementById('panels').classList.remove('visible');
  document.getElementById('empty').classList.remove('hidden');
  document.getElementById('closeBtn').style.display = 'none';
  document.getElementById('keyHint').classList.remove('visible');
  document.getElementById('panelData').classList.remove('has-data');
  document.querySelectorAll('.bg-img').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.thumb').forEach(function(t) { t.classList.remove('active'); });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeView();
  if (!current) return;
  if (e.key === 'ArrowRight') openVariant(current < 5 ? current + 1 : 1);
  if (e.key === 'ArrowLeft') openVariant(current > 1 ? current - 1 : 5);
});

var tx = 0;
document.addEventListener('touchstart', function(e) { tx = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', function(e) {
  if (!current) return;
  var dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) < 50) return;
  openVariant(dx < 0 ? (current < 5 ? current + 1 : 1) : (current > 1 ? current - 1 : 5));
});

if (window.matchMedia('(hover: hover)').matches) {
  document.getElementById('stage').addEventListener('mousemove', function(e) {
    var rect = this.getBoundingClientRect();
    var cx = (e.clientX - rect.left) / rect.width - 0.5;
    var cy = (e.clientY - rect.top) / rect.height - 0.5;
    var l = document.getElementById('bgLayer');
    l.style.transition = 'transform 0.1s ease-out';
    l.style.transform = 'translate(' + (cx*-18) + 'px,' + (cy*-12) + 'px)';
  });
  document.getElementById('stage').addEventListener('mouseleave', function() {
    var l = document.getElementById('bgLayer');
    l.style.transition = 'transform 0.8s ease';
    l.style.transform = 'translate(0,0)';
  });

  document.querySelectorAll('.thumb').forEach(function(thumb) {
    var v = parseInt(thumb.id.replace('t',''));
    thumb.addEventListener('mouseenter', function() {
      if (current) return;
      document.querySelectorAll('.bg-img').forEach(function(el) { el.classList.remove('active'); });
      document.getElementById('bg' + v).classList.add('active');
    });
    thumb.addEventListener('mouseleave', function() {
      if (current) return;
      document.querySelectorAll('.bg-img').forEach(function(el) { el.classList.remove('active'); });
    });
    var img = thumb.querySelector('.thumb-img-wrap img');
    thumb.addEventListener('mousemove', function(e) {
      var rect = thumb.getBoundingClientRect();
      var x = (e.clientX - rect.left) / rect.width - 0.5;
      var y = (e.clientY - rect.top) / rect.height - 0.5;
      img.style.transform = 'rotateY(' + (x*12) + 'deg) rotateX(' + (-y*7) + 'deg) scale(1.05)';
      img.style.transition = 'transform 0.1s ease-out, filter 0.3s';
    });
    thumb.addEventListener('mouseleave', function() {
      img.style.transform = '';
      img.style.transition = 'transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94), filter 0.3s';
    });
  });
}
</script>
</body>
</html>
